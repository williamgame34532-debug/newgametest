name: Build SCP Zone-19

on:
  push:
    paths:
      - 'SCPZone19/**'
      - '.github/workflows/build-scpzone19.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SCPZone19/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build mod jar
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Package release bundle
        run: |
          mkdir -p ../dist/release
          cp build/libs/scpzone19-*.jar ../dist/release/
          (cd ../resourcepack && zip -qr ../dist/release/SCP-Zone19-Interface-ResourcePack.zip .)
          cp ../README.md ../CREDITS.md ../dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: scpzone19-1.20.1
          path: SCPZone19/dist/release/
