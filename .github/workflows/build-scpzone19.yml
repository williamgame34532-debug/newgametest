name: Build SCP Zone-19

on:
  push:
    paths:
      - 'SCPZone19/mod/**'
      - 'SCPZone19/resourcepack/**'
      - '.github/workflows/build-scpzone19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SCPZone19/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
      - name: Build mod jar
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - name: Package release bundle
        run: |
          mkdir -p ../dist/release
          cp build/libs/scpzone19-*.jar ../dist/release/
          (cd ../resourcepack && zip -qr ../dist/release/SCP-Zone19-Interface-ResourcePack.zip .)
          cp ../README.md ../CREDITS.md ../dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: scpzone19-1.20.1
          path: SCPZone19/dist/release/
      - name: Commit the built jar back to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: SCPZone19
        run: |
          mkdir -p dist/jar
          rm -f dist/jar/*.jar
          cp mod/build/libs/scpzone19-*.jar dist/jar/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/jar
          git diff --cached --quiet || (git commit -m "Built mod jar [skip ci]" && git push)
