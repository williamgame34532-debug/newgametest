name: Build Minecraft mods

on:
  push:
    paths:
      - 'mods/**'
      - '.github/workflows/build-mods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          mods=$(find mods -mindepth 2 -maxdepth 2 -name build.gradle -printf '%h\n' | xargs -n1 basename | grep -v '^_template$' | sort | jq -R . | jq -sc .)
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "Mods: $mods"
      - name: Forge versions for 1.21.1
        run: curl -s https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o '1\.21\.1-[0-9.]*' | tail -n 15

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: ${{ fromJson(needs.discover.outputs.mods) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build ${{ matrix.mod }}
        working-directory: mods/${{ matrix.mod }}
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: mods/${{ matrix.mod }}/build/libs/*.jar

  release:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: mods-release-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true
      - name: Keep only real mods
        run: |
          mkdir -p jars
          rm -f jars/apiprobe-*.jar
          ls -la jars
      - name: Commit jars back to the branch (mods/dist)
        if: hashFiles('jars/*.jar') != ''
        run: |
          mkdir -p mods/dist
          for f in jars/*.jar; do
            base=$(basename "$f" | sed -E 's/-1\.21\.1-.*//')
            rm -f mods/dist/${base}-1.21.1-*.jar
            cp "$f" mods/dist/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/dist
          if ! git diff --cached --quiet; then
            git commit -m "Built mod jars [skip ci]"
            for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          fi
      - name: Publish jars to the "mods-latest" release
        if: hashFiles('jars/*.jar') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mods-latest
          name: Minecraft mods (latest build)
          body: Automatically built Forge 1.21.1 jars from ${{ github.sha }} on ${{ github.ref_name }}. Drop them into your `mods` folder.
          prerelease: true
          make_latest: false
          files: jars/*.jar
